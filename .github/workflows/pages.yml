# Publish the built site to GitHub Pages whenever main changes, so students
# open Datum at a URL with nothing to install.
#
# One-time setup by a repository admin: Settings -> Pages -> Build and
# deployment -> Source: GitHub Actions.
name: Publish to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The same guarded invocation CI uses: --test-force-exit so a jsdom
      # suite's never-idle timers cannot hold the job open, --test-timeout so a
      # wedged suite is failed rather than waited on.
      - run: node --test --test-force-exit --test-timeout=120000 tests/*.test.cjs
      - run: npm run build

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
