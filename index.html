<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DAETUM</title>

    <!--
        THE APPLICATION VERSION.

        Declared here so the About dialog can state it rather than invent one -
        a version number is the first thing anybody quotes when reporting a
        problem, and a made-up one is worse than none because it sends the
        reader after a build that does not exist.

        It matches `version` in package.json. There is deliberately no build
        step rewriting this: the two are changed together, and the About dialog
        says "not recorded in this build" rather than guessing if this tag is
        ever missing.
    -->
    <meta name="version" content="1.0.0">

    <!--
        THE BROWSER TAB ICON.

        ONE FIXED BRAND COLOUR under every theme, and the SAME geometric D the
        header draws. A tab is a separate document, so it is served as a file
        rather than rendered from the page's CSS - which is exactly why it cannot
        and must not be themed.

        AN SVG IS PRIMARY, WITH A PNG FALLBACK. Every current browser reads an
        SVG favicon and scales it cleanly to 16, 32 and 48 pixels, but a PNG is
        offered first-fallback for anything that does not - both carry the SAME
        fixed colour, so the tab looks identical whichever one a browser picks.
    -->
    <link rel="icon" type="image/svg+xml" href="/src/assets/favicon.svg?v=2">
    <link rel="icon" type="image/png" sizes="32x32" href="/src/assets/favicon.png?v=2">
    <link rel="icon" type="image/png" sizes="180x180" href="/src/assets/favicon-180.png?v=2">
    <link rel="apple-touch-icon" sizes="180x180" href="/src/assets/favicon-180.png?v=2">
    <link rel="mask-icon" href="/src/assets/favicon.svg?v=2" color="#087E83">

    <!--
        MATHJAX IS LOADED WITH THE SOLUTION RENDERER, NOT BEFORE IT.

        A third-party typesetting engine on a CDN is the single slowest thing
        on this page's startup: it is fetched, parsed and given its own
        start-up pass while the drawing workspace waits behind it. Only the
        written solution ever needed it, and there is no solution view on this
        page any more. `src/shared/solution/written-references.js` is imported
        on demand (the integration API's setSolution, when a preview exists)
        and it loads this script itself, exactly once. Removing the tag here is
        what takes MathJax out of the boot path entirely.
    -->

    <link rel="stylesheet" href="/src/styles/tokens.css">
    <link rel="stylesheet" href="/src/styles/base.css">
    <link rel="stylesheet" href="/src/styles/editor.css">
    <link rel="stylesheet" href="/src/styles/shell.css">

</head>


<body>


    <!--
        ========================================================
        BAND 1: THE APPLICATION AND DOCUMENT BAR
        ========================================================

        THREE AREAS, LEFT TO RIGHT:

            LEFT    the DAETUM mark and wordmark - the identity
            MIDDLE  the current document's name, with the unsaved mark
            RIGHT   the two workspace tabs, Written Solution and
                    Engineering Drawing

        THE TABS LIVE IN THE HEADER rather than in the page beneath it.
        "Which document and which workspace am I in" is ONE question, so the
        two answers sit on one line: the document name in the middle, the
        workspace on the right. The tabs used to be a full-width strip of their
        own below the header, which read as a third, unrelated row.

        The right column is the WIDTH OF THE TWO TABS and the middle column is
        the space between the brand and them, so the document name has the room
        and TRUNCATES with an ellipsis rather than ever reaching the tabs.
    -->

    <header class="header">

        <!--
            THE IDENTITY: THE DAETUM MARK AND THE WORDMARK.

            THE MARK IS A TARGETING RETICLE WITH AN OPEN ORBIT. A long VERTICAL
            RULE and an ASYMMETRIC HORIZONTAL BAR cross at the solid CENTRAL DOT,
            and an OPEN CIRCULAR ARC wraps around the top, right and bottom of the
            same point. The arc's centre IS that point - the same origin the dot
            and both axes share - so nothing is offset and the opening, 124
            degrees wide, is the LEFT flank.

            THE RULE OVERSHOOTS THE ARC at both ends and the bar reaches further
            LEFT than right, so the figure reads as an engineered targeting mark
            rather than as a conventional letter D or a closed crosshair. The
            arc's two ends hang clear of the rule in the upper-left and lower-left.

            IT IS THE SAME GEOMETRY AS THE BROWSER TAB ICON, generated from
            `app/daetum-mark.js`. The coordinates below are that module's, placed
            here as static markup because the header must paint before any script
            runs.

            THE COLOUR FOLLOWS THE THEME, NOT THE ACCENT. The mark is
            `currentColor`, which `--logo-color` sets - dark ink on the light
            interface, ice-white on the dark one - so it stays legible on either
            surface without a second rule per palette. It deliberately does NOT
            take the teal accent: the accent is the colour of buttons, selections
            and focus rings, so a mark painted in it reads as something to click.

            THE DOT IS DRAWN LAST, so it sits over both axes and no line runs
            visibly through the filled centre.
        -->
        <div class="header-identity">
            <span class="header-mark" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="24" height="24" focusable="false">
                    <path fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"
                        d="M11.2 -0.2V24.2"/>
                    <path fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"
                        d="M3 12H15.3"/>
                    <path fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"
                        d="M6.787 3.7A9.4 9.4 0 1 1 6.787 20.3"/>
                    <circle cx="11.2" cy="12" r="2.9" fill="currentColor"/>
                </svg>
            </span>

            <h1 class="header-wordmark">
                DAETUM
            </h1>
        </div>

        <!--
            THE CURRENT DOCUMENT'S NAME.

            Secondary information, so it is smaller than the application name
            and sits between the brand and the workspace tabs rather than beside
            the brand - it names the drawing, not the application, and it must
            not compete with the heading for attention.

            The BASE name only: a file called triangle.tex reads
            "triangle" here. The extension belongs to the file, not to the way
            the application talks about it.
        -->
        <div
            class="header-document"
            id="headerDocumentName"
            title=""
        >
            <span
                class="header-document-name"
                id="headerDocumentBaseName"
            ></span>
            <span
                class="header-document-dirty"
                id="headerDocumentDirty"
                aria-label="Unsaved changes"
                title="Unsaved changes"
                hidden
            ></span>
        </div>

        <!--
            NO WORKSPACE TABS.

            There is one workspace - Engineering Drawing - so there is nothing to
            switch between. The strip that used to hold "Written Solution" and
            "Engineering Drawing" is gone rather than hidden: a control that
            chooses between one thing is not a control.
        -->

    </header>


    <main class="page">


        <!--
            THE WORKSPACE TABS HAVE MOVED INTO BAND 1.

            They are the right-hand third of the application and document bar
            now, beside the document name they belong with, rather than a
            full-width strip of their own here. The switching behaviour is
            unchanged - `app/tabs.js` still keys on `.tab[data-tab]` wherever
            the buttons live.
        -->





        <!-- =================================================
             DRAWING TAB
        ================================================== -->

        <section
            id="drawing"
            class="review-content"
        >
            <!-- Shared CAD workspace: toolsets change, canvas and inspector persist. -->
            <div class="drawing-workspace">
                <!--
                    ========================================================
                    BAND 2: THE MAIN MENU BAR
                    ========================================================

                    File, Edit, Insert, View, Tools, Help - one row, directly
                    beneath the application and document bar, above the toolset
                    selector. Six labels and nothing else: no Command Search
                    (that is Band 4), no extra top-level menus, no decorative
                    carets.

                    IT NOW SITS ABOVE THE TOOLSET SELECTOR, and the two are
                    stacked inside ONE shared top rail - a single grid child with
                    one horizontal scroller - so the menu is the top row, the
                    toolsets the row beneath it, and scrolling either one moves
                    both. See the rail's markup below and
                    `.drawing-top-rail` in `styles/editor/workspace-chrome.css`.

                    The menu bar is built by script: a menu's items change with
                    the state (Undo greys out, a visibility item's label flips),
                    so static markup would have to be kept in step by hand. See
                    `editor/toolbar/menu-commands.js` for the six menus and
                    `ui/menubar/menu-bar.js` for how they behave.

                    IT SURVIVES THE DRAWING'S OWN HIDE CONTROL. That control
                    folds away the DRAWING's chrome - the toolset bar and the
                    style strip - not the application's menu, so the menu stays
                    reachable at every width. See
                    `body.datum-topbar-hidden` in `styles/editor.css`.
                -->

                    <!--
                        THE GLOBAL TOOL BAR IS GONE.

                        It held New, Open, Save, Save As, Print, Undo, Redo,
                        Move, Rotate, Mirror, Trim, Extend, the draw-order
                        controls, Pan, Zoom and Fit - and every one of those is
                        a COMMAND, which is exactly what a menu bar is for. Two
                        rows of File/Save/Undo on one screen is how a student
                        ends up unsure which one is real, so the bar has been
                        removed and the commands live in the menus:

                            File   New, Open, Save, Save As, Print
                            Edit   Undo, Redo, Cut, Copy, Paste, Select All, Delete
                            Insert Image, Table, Text Box, Drawing / Diagram
                            View   Pan, Zoom In, Zoom Out, Fit, the display switches
                            Tools  Drawing Settings, Precision & Snapping,
                                   Measurement & Inspection, Keyboard Shortcuts,
                                   and the Modify tools

                        NOTHING WAS LOST. Every command that was on the bar is
                        reachable from a menu, each calling the same function
                        the button called - so the tool that arms is the tool
                        the button armed.

                        WHAT REMAINS IS BAND 4 BELOW, which is a row of
                        SETTINGS rather than commands - a command search, undo
                        and redo, then thickness, colour, line type, grid, snap,
                        dimensions and magnitudes. Those stay on
                        screen because they are adjusted constantly while drawing
                        and a menu click for each one would be friction with
                        nothing gained.
                    -->

                <!--
                    ========================================================
                    BAND 3: THE WORKSPACE AND TOOLSET SELECTOR
                    ========================================================

                    One row, beneath the menu bar and above the quick-access
                    toolbar, in the fixed order the specification gives:
                    Geometry, Annotate, Statics, Dynamics, Fluids,
                    Thermodynamics, Heat Transfer, Solid Mechanics, Mechanical
                    Design, Controls, Math / Analysis.

                    IT CHOOSES A TOOLSET AND NOTHING ELSE. It is not the
                    workspace tabs (those are in Band 1) and not the main menu -
                    the menu offers application commands, this changes which
                    collection of drawing tools the Tools panel shows.

                    ONE ROW THAT NEVER WRAPS. Eleven named toolsets do not fit a
                    narrow window, so the row is kept on a single line and the
                    SHARED TOP RAIL scrolls horizontally instead - together with
                    the menu bar above it. See below.
                -->
                <!--
                    ========================================================
                    THE SHARED TOP RAIL: MENU BAR ABOVE SECTION BAR
                    ========================================================

                    The main menu (File, Edit, Insert, View, Tools, Help) and the
                    toolset selector are ONE navigation area. Each is a single
                    non-wrapping row, and BOTH live inside this one scroller, so
                    scrolling either bar moves the other by the same offset - the
                    two can never drift out of alignment. The menu is on top and
                    the toolset bar directly beneath it; the rail is one grid row
                    of the workspace, so neither bar can push the page wider.

                    `styles/editor/workspace-chrome.css` owns the rail.
                -->
                <div class="drawing-top-rail" id="drawingTopRail">
                <div
                    class="drawing-top-rail-scroll"
                    id="drawingTopRailScroll"
                    tabindex="0"
                    aria-label="Menu bar and toolsets"
                >
                <div class="drawing-top-rail-track">

                <!--
                    BAND 2: THE MAIN MENU BAR.

                    Built by script into this placeholder (see
                    `components/layout/menu-bar/menu-bar.js`).
                -->
                <div class="drawing-menu-controls-bar">
                    <div id="datumMenuBar" class="datum-menubar" aria-label="Main menu"></div>
                    <!--
                        THE DIVIDER BETWEEN THE MENUS AND THE CONTROLS BELOW.
                        See `.drawing-menu-controls-bar > .drawing-style-strip::before`
                        in `toolbar.css`.
                    -->
                    <!--
                    ========================================================
                    THE QUICK-ACCESS BAR: SEARCH, UNDO/REDO, THE STYLE CONTROLS AND THE
                    DISPLAY TOGGLES
                    ========================================================

                    The order left to right is mandatory and is the order the
                    work happens in: find the command, step back if it was
                    wrong, adjust how the drawing is being made, then adjust
                    how it is read.

                    Search  Undo  Redo  |  Thickness  Color  Line Type
                    |  Grid  Snap  Dimensions  Magnitudes

                    ICON-FIRST. Every control except Command Search is
                    represented by its ICON rather than by a word: a toolbar of
                    labelled controls was a paragraph of small text, and the
                    labels were repeating what the icons and the tooltips
                    already said. Command Search stays a text field because it
                    has to be typed into.

                    NOTHING IS LOST WITH THE WORDS. Every icon-only control
                    carries a `title` (the tooltip) and an `aria-label` (its
                    accessible name), so each one is named on hover and to a
                    screen reader. The three property controls also keep their
                    `<select>` and `<input>` underneath, so the full value list
                    is still reachable.

                    THE SEPARATORS SEPARATE FAMILIES: history actions | drawing
                    properties | display and annotation controls. There is no
                    separator among Grid, Snap, Dimensions and Magnitudes -
                    they are one related group and read as one.

                    THREE KINDS OF CONTROL, THREE BEHAVIOURS: actions (Undo,
                    Redo) never stay lit; value selectors (Thickness, Color,
                    Line Type) show a real value without looking
                    toggled on; toggles (Grid, Snap, Dimensions, Magnitudes)
                    show a persistent on/off state.

                    THE DRAWING'S HIDE CONTROL IS ON THE TOOLSET BAR ABOVE,
                    not here - see `editor/workspace/workspace-layout.js`.
                    -->
                    <div class="drawing-style-strip" aria-label="Command search and quick-access controls">
                    <label class="drawing-command-search" aria-label="Search commands">
                    <svg viewBox="0 0 20 20" width="15" height="15" aria-hidden="true" class="drawing-command-search-icon"><circle fill="none" stroke="currentColor" stroke-width="1.6" cx="9" cy="9" r="5"/><path fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" d="M12.8 12.8L17 17"/></svg>
                    <input
                    type="search"
                    id="drawingCommandSearch"
                    data-command-search
                    placeholder="Search commands&#8230;"
                    aria-label="Search commands"
                    autocomplete="off"
                    spellcheck="false"
                    >
                    <kbd class="drawing-command-search-key" title="Focus the search field">Ctrl+K</kbd>
                    </label>

                    <!--
                    UNDO AND REDO, immediately after the search.

                    These are the application's own history - the same
                    commands the Edit menu and Ctrl+Z use - so there is one
                    history with three doors onto it, not three histories.

                    The ids are kept (`drawingUndo`, `drawingRedo`) because
                    `updateHistoryControls` disables them by id, and the Edit
                    menu reads the same can-undo/can-redo state.

                    ACTIONS, NOT TOGGLES: they give hover, focus and a brief
                    pressed feedback, and never stay highlighted after a
                    click.
                    -->
                    <button class="drawing-toolbar-icon-button" id="drawingUndo" type="button" title="Undo (Ctrl+Z)" aria-label="Undo">
                    <svg viewBox="0 0 20 20" width="17" height="17" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" d="M7 6L3 10l4 4"/><path fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" d="M4 10h7a4 4 0 0 1 4 4v1"/></svg>
                    </button>
                    <button class="drawing-toolbar-icon-button" id="drawingRedo" type="button" title="Redo (Ctrl+Y)" aria-label="Redo">
                    <svg viewBox="0 0 20 20" width="17" height="17" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" d="M13 6l4 4-4 4"/><path fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" d="M16 10H9a4 4 0 0 0-4 4v1"/></svg>
                    </button>

                    <span class="drawing-style-strip-divider" aria-hidden="true"></span>

                    <!--
                    THICKNESS, COLOUR AND LINE TYPE: VALUE CONTROLS.

                    Each is icon-first. The ICON carries the meaning and is
                    drawn from the CURRENT VALUE, so the control states its
                    own setting without a word beside it:

                    Thickness  a stroke whose bar thickness IS the value
                    Color      the swatch IS the value (the real drawing
                    colour, never the interface accent)
                    Line Type  a line drawn in the actual pattern

                    THE SELECT IS STILL THE CONTROL. It is visually hidden
                    but present and focusable, so the full list of supported
                    values is reachable by keyboard, by a screen reader, and
                    by clicking the icon - which opens it. That keeps the
                    existing values, units and validation exactly as they
                    were; nothing here re-implements a picker.

                    A VALUE CONTROL NEVER LOOKS TOGGLED. It takes hover,
                    focus and an open-state treatment, and nothing else - a
                    permanent green background would claim a state the
                    drawing does not have.
                    -->
                    <!--
                    =========================================================
                    THE THREE LINE PROPERTIES: THICKNESS, COLOUR, LINE TYPE
                    =========================================================

                    THREE IDENTICAL CONTROLS. Each is the same box - one
                    `<select>` (or the colour input) laid invisibly over one
                    icon - so the three are the same size, the same shape and
                    the same distance apart, and nothing about one of them is
                    special.

                    THE ICONS ARE FIXED ARTWORK, NOT PREVIEWS. The thickness
                    and line-type icons are plain, static drawings: they label
                    the control rather than re-drawing themselves from the
                    value. Live previews were the source of most of the trouble
                    here - the icon changed size and shape as the value moved,
                    so the three buttons stopped looking like a set - and the
                    VALUE IS ALREADY ON THE TOOLTIP and in the dropdown, which
                    is where it belongs.

                    The colour control shows the current colour in the drop,
                    because a colour swatch has to show the colour. That is the
                    one place it is genuinely the value.
                    -->
                    <div class="drawing-strip-field drawing-strip-icon-control">
                    <select id="drawingThickness" class="drawing-strip-icon-select" title="Line thickness" aria-label="Line thickness">
                    <option value="0.25">0.25 mm</option>
                    <option value="0.5" selected>0.50 mm</option>
                    <option value="0.75">0.75 mm</option>
                    <option value="1">1.00 mm</option>
                    </select>
                    <span class="drawing-strip-icon" aria-hidden="true">
                    <svg viewBox="0 0 20 20" width="18" height="18"><path fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" d="M5 7h10"/><path fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" d="M5 13h10"/></svg>
                    </span>
                    </div>

                    <div class="drawing-strip-field drawing-strip-icon-control">
                    <label class="drawing-strip-colour" title="Drawing colour">
                    <input id="drawingColor" type="color" value="#193335" aria-label="Drawing colour" title="Drawing colour">
                    <span class="drawing-strip-icon" aria-hidden="true">
                    <svg viewBox="0 0 20 20" width="18" height="18"><path class="drawing-strip-icon-fill" stroke="none" d="M10 5.4c1.6 2.2 3.4 4 3.4 5.8a3.4 3.4 0 0 1-6.8 0c0-1.8 1.8-3.6 3.4-5.8z"/><path fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" d="M10 5.4c1.6 2.2 3.4 4 3.4 5.8a3.4 3.4 0 0 1-6.8 0c0-1.8 1.8-3.6 3.4-5.8z"/></svg>
                    </span>
                    </label>
                    </div>

                    <div class="drawing-strip-field drawing-strip-icon-control">
                    <select id="drawingLineType" class="drawing-strip-icon-select" title="Line type" aria-label="Line type">
                    <option value="solid">Solid</option>
                    <option value="dashed">Dashed</option>
                    <option value="center">Center</option>
                    <option value="construction">Construction</option>
                    </select>
                    <span class="drawing-strip-icon" aria-hidden="true">
                    <!--
                    LINE TYPE: A RULE DRAWN IN THE SELECTED PATTERN.

                    The dash pattern IS the value, so solid, dashed, centre
                    and construction each read straight off the icon - the
                    control shows what is selected rather than merely naming
                    itself. `stroke-dasharray` is set on this path by
                    `style-controls.js` from the real line type.
                    -->
                    <svg viewBox="0 0 20 20" width="18" height="18"><path id="drawingLineTypeStroke" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M3.5 10h13"/></svg>
                    </span>
                    </div>

                    <!--
                    =========================================================
                    FONT SIZE: THE QUICK-ACCESS TEXT SIZE CONTROL
                    =========================================================

                    A NUMBER FIELD WITH ITS UNIT, beside the line properties and in
                    the same box as the other value controls. It edits the ONE
                    `style.fontSize` every text object already carries:

                      a selected text object or dimension label  that object's
                        size, changed in place, undoable, and written to the
                        source on the same commit;
                      nothing text-like selected              the default for the
                        next text drawn.

                    IT IS NOT A SECOND SIZE SYSTEM. The Features panel's Font Size
                    field and this input are two views of one property, so
                    `syncStyleControls` writes both from the model and either one
                    can be the door onto the same value.

                    THE UNIT IS STATED, because a size without one is a guess.
                    Text annotations state their size in points, which is also what
                    the source prints (`\fontsize{11pt}`) and what a drafter
                    writes - so the number in this field is the number in the
                    exported document.
                    -->
                    <div class="drawing-strip-field drawing-strip-font-control"
                    title="Text size in points">
                    <label class="drawing-strip-font" for="drawingFontSize">
                    <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" d="M4 16L9 4l5 12"/><path fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" d="M6 12h6"/><path fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" d="M15 9h3M16.5 9v6M15 15h3"/></svg>
                    <input id="drawingFontSize" class="drawing-strip-font-input"
                    type="number" inputmode="decimal" step="1" min="4" max="200"
                    value="11" aria-label="Text size in points"
                    title="Text size: 11 pt">
                    <span class="drawing-strip-font-unit" aria-hidden="true">pt</span>
                    </label>
                    </div>

                    <span class="drawing-style-strip-divider" aria-hidden="true"></span>

                    <!--
                    SPECIAL SYMBOLS: a quick-access control beside Line Type.

                    It is a FORMATTING control, not a drawing tool: it opens the
                    same Symbols list the Annotate category's Symbols tool opens
                    and inserts the chosen glyph at the caret of the text field
                    being edited. The category and its tool are untouched.
                    -->
                    <button class="drawing-status-toggle drawing-special-symbols" id="drawingSpecialSymbols"
                    type="button" title="Special Symbols" aria-label="Special Symbols" aria-pressed="false">
                    <svg class="drawing-toolbar-icon" viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" d="M11.4 4.2c-.8-.9-2.2-1-3.1-.2-1 .9-.9 2.4 0 3.2l3.4 3.1c.9.8 1 2.3 0 3.2-.9.8-2.3.7-3.1-.2"/><path fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" d="M10 3v14"/></svg>
                    </button>

                    <span class="drawing-style-strip-divider" aria-hidden="true"></span>

                    <!--
                    GRID, SNAP, DIMENSIONS, MAGNITUDES: ICON-ONLY TOGGLES.

                    Each has TWO PERSISTENT VISUAL STATES, and the state is
                    read from the real shared setting - `state.grid.visible`,
                    `state.snap.enabled` and the two `state.display` flags -
                    never from a decorative flag of its own.

                    THE STATE IS NOT COLOUR ALONE. An "on" toggle carries a
                    filled surface, a border and a brighter icon as well as
                    the green, so it is still readable in a monochrome view
                    and to a student who cannot distinguish the green. The
                    `aria-pressed` attribute states it for a screen reader,
                    and the tooltip is kept up to date with ON/OFF.

                    Grid and Snap change HOW the drawing is made; Dimensions
                    and Magnitudes change how it is READ. They are four
                    independent switches, so "magnitudes without dimensions"
                    is a state the row can express.
                    -->
                    <button class="drawing-status-toggle active" id="drawingGridToggle" type="button" data-toggle-name="Grid" aria-pressed="true" title="Grid: on" aria-label="Grid">
                    <!-- GRID: a ruled sheet - the grid the drawing sits on. -->
                    <svg class="drawing-toolbar-icon" viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><rect fill="none" stroke="currentColor" stroke-width="1.5" x="3.5" y="3.5" width="13" height="13" rx="1"/><path fill="none" stroke="currentColor" stroke-width="1.5" d="M3.5 8h13M3.5 12h13M8 3.5v13M12 3.5v13"/></svg>
                    </button>
                    <button class="drawing-status-toggle active" id="drawingSnapToggle" type="button" data-toggle-name="Snap" aria-pressed="true" title="Snap: on" aria-label="Snap">
                    <!--
                    SNAP: a cursor tip aligned with a target point.
                    -->
                    <svg class="drawing-toolbar-icon" viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" d="M2 6V2h4M10 2h4v4M2 10v4h4"/><circle fill="currentColor" cx="8" cy="8" r="1.5"/><path fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" d="M8 8l3.5 9 1.5-4 4-1.5z"/></svg>
                    </button>
                    <button class="drawing-status-toggle active" id="drawingDimensionsToggle" type="button" data-toggle-name="Dimensions" aria-pressed="true" title="Dimensions: on" aria-label="Dimensions">
                    <!--
                    DIMENSIONS: a ruler with measurement tick marks.
                    -->
                    <svg class="drawing-toolbar-icon" viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><rect x="2" y="6" width="16" height="8" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.4"/><path fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" d="M5 6v4M7.5 6v2.5M10 6v4M12.5 6v2.5M15 6v4"/></svg>
                    </button>
                    <button class="drawing-status-toggle active" id="drawingMagnitudesToggle" type="button" data-toggle-name="Magnitudes" aria-pressed="true" title="Magnitudes: on" aria-label="Magnitudes">
                    <!--
                    MAGNITUDES: A FORCE ARROW WITH ITS VALUE.

                    A force arrow with an F label above it
                    represents showing or hiding force magnitudes.
                    -->
                    <svg class="drawing-toolbar-icon" viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><text x="9" y="9" text-anchor="middle" fill="currentColor" font-family="Georgia, serif" font-size="11" font-style="italic">F</text><path fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" d="M3 14h14M13.5 10.5L17 14l-3.5 3.5"/></svg>
                    </button>

                    <!--
                    FIT: A ONE-SHOT ACTION, NOT A TOGGLE.

                    Fit is a COMMAND, not a workspace setting. It has no
                    persistent on/off state of its own - pressing it fits
                    the drawing to the view once and leaves nothing to turn
                    back off - so it is NOT a `drawing-status-toggle` and
                    carries no `aria-pressed` or active treatment. It is a
                    plain action button, styled like the zoom controls
                    beside it, so it does not read as a fifth switch.
                    -->
                    <button class="drawing-action-button" id="drawingFitView" type="button" title="Fit drawing to view" aria-label="Fit drawing to view">
                    <svg class="drawing-toolbar-icon" viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" d="M7 3H3v4M13 3h4v4M17 13v4h-4M7 17H3v-4"/><rect x="6.5" y="6.5" width="7" height="7" rx="1" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>
                    </button>

                    </div>
                </div>

                <nav class="drawing-toolbar" aria-label="Engineering toolsets">
                    <!--
                        THE TOOLSETS AND THE HIDE CONTROL, IN ONE ROW.

                        The row does not scroll on its own - the rail above
                        scrolls both rows together, through
                        `.drawing-top-rail-scroll`. The Hide control is outside
                        the scroller entirely, pinned to the rail's right edge.
                    -->
                    <div class="drawing-toolbar-scroll" role="group" aria-label="Toolsets">
                        <button class="drawing-category active" data-category="GEOMETRY">GEOMETRY</button>
                        <button class="drawing-category" data-category="ANNOTATE">ANNOTATE</button>
                        <button class="drawing-category" data-category="STATICS">STATICS</button>
                        <button class="drawing-category" data-category="DYNAMICS">DYNAMICS</button>
                        <button class="drawing-category" data-category="FLUIDS">FLUIDS</button>
                        <button class="drawing-category" data-category="THERMODYNAMICS">THERMODYNAMICS</button>
                        <button class="drawing-category" data-category="HEAT TRANSFER">HEAT TRANSFER</button>
                        <button class="drawing-category" data-category="SOLID MECHANICS">SOLID MECHANICS</button>
                        <button class="drawing-category" data-category="MECHANICAL DESIGN">MECHANICAL DESIGN</button>
                        <button class="drawing-category" data-category="CONTROLS">CONTROLS</button>
                        <button class="drawing-category" data-category="MATH / ANALYSIS">MATH / ANALYSIS</button>
                    </div>

                    <!--
                        The Hide control is NOT here any more. It is a direct
                        child of the rail, outside this scroller, so it is on
                        screen at every scroll position and every width - see
                        the button after the rail's closing tags.
                    -->
                </nav>

                </div>
                </div>

                <!--
                    THE HIDE CONTROL LIVES OUTSIDE THE SCROLLER, ON THE RAIL.

                    It is the way back from the sliver, so it must be on screen
                    at every scroll position and every width. Inside the
                    scroller it would be pushed to the end of eleven toolsets,
                    off the right of a compressed window - the one control that
                    could not be found when it was needed. Out here it is
                    `position: absolute; right: 0` against the rail, which is
                    the visible box (see `.drawing-top-rail` in
                    `workspace-chrome.css`).

                    It still does exactly the same job: it folds the drawing's
                    top bars away, and the Show control that replaces it sits
                    at the top of the canvas.
                -->
                <button
                    class="drawing-topbar-hide"
                    id="headerHideButton"
                    type="button"
                    title="Hide the drawing's top bars to give the canvas more room"
                    aria-controls="drawing"
                    aria-expanded="true"
                >
                    <svg viewBox="0 0 16 16" aria-hidden="true">
                        <path d="M3 10l5-5 5 5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    <span class="header-hide-text">Hide</span>
                </button>

                </div>



                
                <!--
                    The tool panel's own column, holding a single
                    hide/show arrow. The arrow is a SIBLING of the
                    panel rather than a control inside it, so it
                    survives the panel being collapsed: a control
                    inside the thing it collapses would take
                    itself out of reach.
                -->
                <div class="drawing-panel-rail drawing-panel-rail-left">
                    <button
                        class="drawing-panel-toggle"
                        id="drawingToolPanelToggle"
                        type="button"
                        aria-expanded="true"
                        aria-controls="drawingToolPanel"
                        title="Hide tools"
                    >
                        <svg viewBox="0 0 16 16" aria-hidden="true">
                            <path d="M10 3L5 8l5 5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                        <span class="drawing-panel-toggle-text">HIDE</span>
                    </button>

                    <aside class="drawing-tool-panel" id="drawingToolPanel" aria-label="Tools">
                        <h2 class="drawing-panel-heading" id="drawingToolHeading">GEOMETRY TOOLS</h2>
                        <div class="drawing-tool-list" id="drawingToolList"></div>
                    </aside>
                </div>

                    <!--
                        THE WAY BACK, ONCE THE TOP BAR IS HIDDEN.

                        A THIN LINE ACROSS THE WHOLE TOP, with the Show control
                        at the RIGHT - the same corner the Hide button held on
                        the toolset bar, so the pointer that pressed Hide is
                        already over the way back.

                        The line is not a floating overlay covering the work: it
                        takes its own row above the canvas, full width.

                        A small white Show tab with a downward arrow restores
                        the top toolbar.
                    -->
                    <div class="drawing-topbar-show-row">
                        <button
                            class="drawing-topbar-show"
                            id="drawingTopBarShow"
                            type="button"
                            title="Show the top bar"
                            aria-label="Show the top bar"
                            aria-controls="drawing"
                            hidden
                        >
                            <svg viewBox="0 0 16 16" aria-hidden="true">
                                <path d="M3 6l5 5 5-5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>
                            <span>Show</span>
                        </button>
                    </div>

                <div class="drawing-canvas-area">
                    <div class="drawing-canvas" aria-label="Engineering drawing canvas">
                    </div>
                </div>

                <div class="drawing-sheet-bar-row">
                    <div class="drawing-sheet-bar" id="drawingSheetTabs" role="tablist" aria-label="Drawing sheets"></div>
                </div>

                <!--
                    The drawing inspector's column, mirroring the left
                    rail so both sides collapse by the same gesture
                    and the two arrows read as one idea.

                    The inspector holds THREE sibling tabs, always in this
                    order: Objects, Features, Source. Each has one job - Objects
                    lists and selects what is drawn, Features edits the
                    PROPERTIES OF THE SELECTION (across every tool category),
                    Source edits the drawing's TikZ - and all three read the
                    one shared selection and drawing state.

                    There is deliberately no Properties tab: Features IS the
                    properties editor, for whatever is selected.
                -->
                <div class="drawing-panel-rail drawing-panel-rail-right">
                    <aside class="drawing-inspector" id="drawingFeaturesPanel" aria-label="Drawing inspector">
                        <div class="drawing-panel-tabs" role="tablist" aria-label="Drawing panel">
                            <button class="drawing-panel-tab" id="drawingPanelTabObjects" type="button" role="tab" data-panel-tab="objects" aria-selected="true" aria-controls="drawingPanelObjects">Objects</button>
                            <button class="drawing-panel-tab" id="drawingPanelTabFeatures" type="button" role="tab" data-panel-tab="features" aria-selected="false" aria-controls="drawingPanelFeatures">Features</button>
                            <button class="drawing-panel-tab" id="drawingPanelTabSource" type="button" role="tab" data-panel-tab="source" aria-selected="false" aria-controls="drawingPanelSource">Source</button>
                        </div>

                        <!-- Objects: the list of everything drawn on the active sheet. -->
                        <section class="drawing-panel-pane" id="drawingPanelObjects" role="tabpanel" aria-labelledby="drawingPanelTabObjects" data-panel-pane="objects">
                            <div class="drawing-inspector-message" id="drawingObjects">No objects on this sheet yet.</div>
                        </section>

                        <!--
                            Features: the SELECTED objects' editable properties.
                            Empty - with no message and no controls - when the
                            selection is empty, which is why the host starts
                            blank rather than holding an instruction.
                        -->
                        <section class="drawing-panel-pane drawing-panel-pane-features" id="drawingPanelFeatures" role="tabpanel" aria-labelledby="drawingPanelTabFeatures" data-panel-pane="features" hidden>
                            <div class="drawing-features-body" id="drawingFeatures"></div>
                        </section>

                        <!-- Source: the drawing's own LaTeX/TikZ. -->
                        <section class="drawing-panel-pane drawing-panel-pane-source" id="drawingPanelSource" role="tabpanel" aria-labelledby="drawingPanelTabSource" data-panel-pane="source" hidden>
                            <!--
                                THREE REGIONS, NEVER OVERLAPPING.

                                The note is instructional and static; the editor takes
                                the height that is left; the status bar sits BELOW the
                                editor and is never part of its scroll area. The editor
                                used to be the pane's only child with a negative margin
                                and an absolutely-sized mirror, so it grew over the
                                status line - which is why the bottom of the pane was
                                unreadable.
                            -->
                            <p class="drawing-source-note" id="drawingSourceNote">Edit the source directly. Changes update the drawing automatically.</p>
                            <div class="drawing-source-editor" id="drawingSourceEditor"></div>
                            <div class="drawing-source-footer" id="drawingSourceFooter">
                                <div class="drawing-source-status" id="drawingSourceStatus" role="status" aria-live="polite">Up to date</div>
                                <div class="drawing-source-diagnostics" id="drawingSourceDiagnostics" hidden></div>
                            </div>
                        </section>
                    </aside>

                    <button
                        class="drawing-panel-toggle"
                        id="drawingFeaturesPanelToggle"
                        type="button"
                        aria-expanded="true"
                        aria-controls="drawingFeaturesPanel"
                        title="Hide features"
                    >
                        <svg viewBox="0 0 16 16" aria-hidden="true">
                            <path d="M6 3l5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                        <span class="drawing-panel-toggle-text">HIDE</span>
                    </button>
                </div>

                <footer class="drawing-status-bar" aria-label="Workspace status">
                    <div class="drawing-status-meta">
                        <span>Ready</span>
                        <span id="drawingCoordinates">X: 0.0 Y: 0.0 mm</span>
                        <span id="drawingToolMessage">Ready</span>
                    </div>
                    <div class="drawing-zoom-controls" aria-label="Zoom controls">
                        <button id="drawingZoomOut" type="button" aria-label="Zoom out">-</button>
                        <input id="drawingZoomValue" type="text" inputmode="decimal" aria-label="Zoom percentage" autocomplete="off" spellcheck="false" value="100%">
                        <button id="drawingZoomIn" type="button" aria-label="Zoom in">+</button>
                    </div>
                </footer>
            </div>

        </section>


    </main>



    <!-- The whole application is one ES module graph; src/main.js is its entry. -->
    <script type="module" src="/src/app/entry/main.js"></script>

</body>

</html>
